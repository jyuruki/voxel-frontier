name: Deploy free multiplayer server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "shared/room-protocol.ts"
      - ".github/workflows/deploy-multiplayer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: multiplayer-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pinned server toolchain
        run: npm ci

      - name: Deploy Durable Object room server
        run: npm exec wrangler deploy -- --config server/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
